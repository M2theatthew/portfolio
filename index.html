<title>Upstate Technology Solutions · Matthew Hunt</title>
<!-- Decodes the redirect from 404.html (see that file for why this
    exists) back into a real path before React Router mounts. -->
<script>
(function (l) {
if (l.search && l.search[1] === '/') {
var decoded = l.search.slice(1).split('&').map(function (s) {
return s.replace(/~and~/g, '&');
}).join('?');
window.history.replaceState(
null, null,
l.pathname.slice(0, -1) + decoded + l.hash
);
}
})(window.location);
</script>

name="description"
content="Upstate Technology Solutions: web development for restaurants, churches, and local service businesses in Honea Path, SC. Real code, no page builders."
/>
