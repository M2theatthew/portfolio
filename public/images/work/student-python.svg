<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowP" cx="80%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#ff3d6e" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#ff3d6e" stop-opacity="0" />
    </radialGradient>
    <pattern id="dotsP" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.05" />
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#0a0a12" />
