<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#1e1e28"/>
  <!-- board frame -->
  <rect x="8" y="12" width="48" height="34" rx="3" fill="#e8e6e0" stroke="#9a9aa4" stroke-width="2"/>
  <!-- white surface -->
  <rect x="11" y="15" width="42" height="26" rx="1.5" fill="#fafaf7"/>
  <!-- doodle lines -->
  <path d="M18 24c4-3 8 2 12-1 3-2 6 1 9-1" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M20 32c5-2 7 3 11 0 3-2 7 1 10-1" stroke="#22c55e" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="46" cy="36" r="2.5" fill="#ef4444"/>
  <!-- tray -->
  <rect x="14" y="42" width="36" height="4" rx="1" fill="#4a4a54"/>
  <!-- markers on tray -->
  <rect x="18" y="40" width="3" height="7" rx="1" fill="#3b82f6"/>
  <rect x="24" y="40" width="3" height="7" rx="1" fill="#ef4444"/>
  <rect x="30" y="40" width="3" height="7" rx="1" fill="#22c55e"/>
  <rect x="36" y="40" width="3" height="7" rx="1" fill="#1e293b"/>
  <!-- hangers -->
  <path d="M20 12v-3a2 2 0 014 0v3" stroke="#9a9aa4" stroke-width="1.5" fill="none"/>
  <path d="M40 12v-3a2 2 0 014 0v3" stroke="#9a9aa4" stroke-width="1.5" fill="none"/>
  <!-- sparkle -->
  <circle cx="52" cy="10" r="1.5" fill="#fbbf24"/>
  <circle cx="12" cy="48" r="1.2" fill="#a78bfa"/>
</svg>
